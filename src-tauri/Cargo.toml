[package]
name = "ap-mail-desktop"
version = "1.1.0"
description = "AP Mail - High-performance Desktop Email & PEC Client"
authors = ["AP Consulting"]
edition = "2021"

[lib]
name = "ap_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# Database SQLite & FTS5
rusqlite = { version = "0.32", features = ["bundled", "bundled-full", "chrono", "serde_json"] }

# Crittografia, Hashing & Content-Addressable Storage
sha2 = "0.10"
hex = "0.4"
tempfile = "3.13"

# Serializzazione e date
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"

# IMAP & TLS
tokio-rustls = "0.26"
rustls-native-certs = "0.8"

# Mail & PEC
mail-parser = "0.11"
quick-xml = { version = "0.37", features = ["serialize"] }
cms = "0.2"
der = "0.7"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "pool", "hostname"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = false
