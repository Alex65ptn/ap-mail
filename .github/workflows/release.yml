name: "Release AP Mail (macOS, Windows, Linux)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Dipendenze native Linux (WebKitGTK, libsoup, appindicator)
      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AP Mail v__VERSION__'
          releaseBody: |
            ### Pacchetti Ufficiali AP Mail
            - **macOS:** `AP Mail_1.0.0_universal.dmg` (Apple Silicon M1/M2/M3/M4 & Intel x86_64)
            - **Windows:** `AP Mail_1.0.0_x64-setup.exe` / `.msi`
            - **Linux:** `ap-mail_1.0.0_amd64.deb` & `ap-mail_1.0.0_amd64.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
