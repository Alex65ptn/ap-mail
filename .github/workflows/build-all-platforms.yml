name: "Compilazione Multipiattaforma AP Mail (Windows, Linux, macOS)"

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows x64 (.exe installer NSIS)'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            name: 'Linux x64 (.deb & .AppImage)'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon & Intel (.dmg)'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Tauri Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AP Mail v__VERSION__ - Client Email & PEC'
          releaseBody: |
            ## AP Mail - Client Email & PEC
            **Prodotto di:** AP Consulting
            **Autore:** Alessandro Patanè

            ### Caratteristiche Principali (Versione Base):
            - **Layout Classico stile Apple Mail**: Tabella orizzontale a colonne (Stato, Mittente, Data ricezione precisa con ora e minuto, Oggetto, Dimensione) ed anteprima sottostante
            - **Supporto PEC & Email ordinaria**: IMAP, POP3 e SMTP nativi
            - **Ricerca Full-Text FTS5 Ultraveloce** su messaggi e allegati
            - **Scadenzario e Calendario integrati**
            - **100% Locale e Confidenziale**

            ### Pacchetti Disponibili al Download:
            - **Windows**: `AP Mail_1.0.0_x64-setup.exe` (Installer NSIS per Windows 10 e 11)
            - **Linux**: `ap-mail_1.0.0_amd64.deb` (Debian/Ubuntu/Mint) e `AP Mail_1.0.0_amd64.AppImage` (Universale Linux)
            - **macOS**: `AP Mail_1.0.0_universal.dmg` (Apple Silicon & Intel x86_64)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
