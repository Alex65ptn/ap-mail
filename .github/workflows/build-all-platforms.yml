name: "Compilazione Multipiattaforma AP Mail (Windows, Linux, macOS)"

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows x64 (.exe installer NSIS)'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            name: 'Linux x64 (.deb & .AppImage)'
            args: '--bundles deb,appimage'
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon & Intel (.dmg)'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Tauri Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AP Mail PLUS v__VERSION__ - Client Email & PEC Forense'
          releaseBody: |
            ## AP Mail PLUS - Client Email & PEC Forense
            **Prodotto di:** AP Consulting
            **Autore:** Alessandro Patanè

            ### Novità di AP Mail PLUS:
            - **AP Legal AI Assistant**: Analisi atti giudiziari e generazione bozze 100% offline e confidenziali
            - **Termini Processuali Cartabia**: Calcolo a ritroso/in avanti con sospensione feriale e 1-click su Scadenzario
            - **Interessi Legali MEF 1942-2026**: Calcolo scaglionato con opzione anatocismo
            - **Parcella Forense D.M. 147/2022**: Calcolo compensi 4 fasi, spese 15%, C.P.A. 4% e I.V.A. 22%
            - **Contributo Unificato D.P.R. 115/2002**: Tabelle ministeriali aggiornate

            ### Pacchetti Disponibili al Download:
            - **Windows**: `AP Mail_1.1.0_x64-setup.exe` (Installer NSIS per Windows 10/11)
            - **Linux**: `ap-mail_1.1.0_amd64.deb` (Debian/Ubuntu/Mint) e `AP Mail_1.1.0_amd64.AppImage` (Universale Linux)
            - **macOS**: `AP Mail_1.1.0_universal.dmg` (Apple Silicon & Intel)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
